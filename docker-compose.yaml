services:
  db:
    image: postgres:16
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    env_file:
      - env/postgres.env
  
  adminer:
    image: adminer
    restart: always
    ports:
    - 8080:8080

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    ports:
      - "6379:6379"
    command: ["redis-server","--appendonly","yes"]
    

  app:
      build:
        context: .
        dockerfile: Dockerfile
      restart: unless-stopped
      env_file:
        - ./env/root.env
        - ./env/server.env
        - ./env/web.env
        - ./env/worker.env
      environment:
        - DATABASE_URL=${DATABASE_URL}
        - POSTGRES_HOST=db
        - POSTGRES_PORT=5432
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD= ${POSTGRES_PASSWORD}
        - POSTGRES_DB=crm
        - REDIS_URL=redis://redis:6379
      ports:
        - "3000:3000"
        - "5000:5000"
      depends_on:
        - db
        - redis

volumes:
  redis-data:
    
