services:
  db:
    image: postgres:16
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - 5432:5432

    environment:
      - POSTGRES_DB=CRM
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  
  adminer:
    image: adminer
    restart: always
    ports:
    - 8080:8080

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    ports:
      - "6379:6379"
    command: ["redis-server","--appendonly","yes"]
    

  app:
      build:
        context: .
        dockerfile: Dockerfile
      restart: unless-stopped
      env_file:
        - apps/server/.env
        - apps/workers/.env
      environment:
        - POSTGRES_HOST=db
        - POSTGRES_PORT=5432
        - POSTGRES_USER=${POSTGRES_USER}
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/CRM
        - REDIS_URL=redis://redis:6379
        - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      ports:
        - "3000:3000"
        - "5000:5000"
      depends_on:
        - db
        - redis

volumes:
  redis-data:
    
